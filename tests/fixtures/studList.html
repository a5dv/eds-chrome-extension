<script>
$('input').blur(function(){
    var month = $(this).attr("month");
    var prestar = 0;
    if (  $(this).attr("atype") == 'Present' ) prestar = $(this).parent().next().children().val();
    else prestar = $(this).parent().prev().children().val();
    var maxmonth = $(this).attr('maxmonth');
    var inputval = $(this).val();
    var totinput = +inputval + +prestar;

    var form_data =  {
        adv   : "F000",  
        sy    : "2627",
        sem   : "A",
        val   : $(this).val(),
        mnth  : $(this).attr("month_key"),
        sno   : $(this).attr("sno"),
        name  : $(this).attr("name"),
        atype : $(this).attr("atype")
    }
    
    if ( maxmonth >= totinput ) {
        $.ajax({
            url     : "../process/studListtodb.php",
            type    : "POST",
            data    : form_data
        });
    } else {
        alert('Invalid input, Number of Days for '+month+' is '+maxmonth);
        $(this).val( $(this).attr('oldval') );
    }

});
function numbersonly(myfield, e, dec)
{
var key;
var keychar;
    
if (window.event)
    key = window.event.keyCode;
else if (e)
    key = e.which;
else
    return true;
keychar = String.fromCharCode(key);
    
// control keys
if ((key==null) || (key==0) || (key==8) || (key==9) || (key==13) || (key==27))
    return true;
    
// numbers
else if ((("0123456789").indexOf(keychar) > -1))
    return true;
    
// decimal point jump
else if (dec && (keychar == "."))
    {
    myfield.form.elements[dec].focus();
    return false;
    }
else
    return false;
}

</script>
